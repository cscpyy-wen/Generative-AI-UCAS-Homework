name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==1.12.1+cpu torchvision==0.13.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.23.5 matplotlib==3.9.4
          python -m pip install -e '.[notebook]' pypdf python-docx
      - name: Validate published reference data
        run: python scripts/verify_reference.py
      - name: Check privacy and checkpoint structure
        run: python scripts/audit_privacy.py . --trust-local-weights --expect-checkpoints 7
      - name: Test model, sampler, and exact resume behavior
        run: python -m unittest discover -s tests -v
      - name: Recreate recorded plots
        run: python scripts/plot_results.py --input results --output reproduced/figures
